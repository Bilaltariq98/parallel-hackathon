<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Kill Switch</title><style>body{background:#080808;color:#fff;font:18px system-ui;margin:0;padding:28px;max-width:480px;margin:auto}h1{font-size:42px}label{display:block;margin:24px 0}input,button{box-sizing:border-box;width:100%;padding:18px;font:inherit;border:1px solid #888;border-radius:0}input{background:#111;color:white;margin-top:8px}button{background:white;color:black;font-weight:bold}button:disabled{opacity:.5}#status{line-height:1.6}</style><h1>KILL SWITCH_</h1><p>Add your company to the city.</p><form><label>Company name<input name="name" maxlength="80" required autocomplete="organization"></label><label>Website domain<input name="domain" maxlength="253" required placeholder="acme.com" autocapitalize="none" spellcheck="false" inputmode="url"></label><button>Add company</button></form><p id="status" role="status"></p><script>
const form=document.querySelector('form'),status=document.querySelector('#status');form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button'),start=Date.now();button.disabled=true;const tick=()=>status.textContent=`Researching · ${Math.floor((Date.now()-start)/1000)}s elapsed`;tick();const timer=setInterval(tick,1000);try{const r=await fetch('/api/company',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),d=await r.json();status.textContent=!r.ok?`Rejected: ${d.error}`:d.status==='researching'?'This company is already being researched.':d.company.verified?`Added · ${d.edges.length} dependencies found.`:'Unverified · We could not find evidence tied to this domain.'}catch{status.textContent='Connection interrupted. Please try again.'}finally{clearInterval(timer);button.disabled=false}};
</script></html>
